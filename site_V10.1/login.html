<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Fornecedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #f87171; /* vermelho-400 */
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-900 rounded-xl shadow-lg w-full max-w-md overflow-hidden">
        <div class="bg-red-600 py-4 px-6">
            <h1 class="text-2xl font-bold text-white">Login do Fornecedor</h1>
            <p class="text-red-100">Entre com seu e-mail e senha para acessar a área do fornecedor</p>
        </div>
        <form id="loginForm" action="arquivos_php/login.php" method="POST" class="p-6 space-y-8">
            <div>
                <h2 class="text-lg font-semibold text-red-600 mb-4 flex items-center gap-2">
                    <i class="fas fa-user"></i> Dados de Acesso
                </h2>
                <div class="space-y-6">
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-200 mb-1">E-mail *</label>
                        <div class="relative">
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-gray-100 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition"
                                placeholder="seu@email.com">
                            <i class="fas fa-envelope absolute right-3 top-3 text-red-600"></i>
                        </div>
                    </div>
                    <!-- Senha -->
                    <div>
                        <label for="senha" class="block text-sm font-medium text-gray-200 mb-1">Senha *</label>
                        <div class="relative">
                            <input type="password" id="senha" name="senha" required minlength="8"
                                class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-gray-100 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 transition pr-10"
                                placeholder="Digite sua senha">
                            <i class="fas fa-eye password-toggle" onclick="togglePassword('senha', this)"></i>
                        </div>
                        <p class="text-xs text-gray-400 mt-1">Mínimo de 8 caracteres</p>
                    </div>
                </div>
            </div>
            <div class="pt-4 flex gap-3 flex-col md:flex-row">
                <button type="submit" class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>
                <button type="button"
                    onclick="window.location.href='cadastro.html';"
                    class="w-full md:w-auto bg-gray-800 hover:bg-gray-700 text-gray-100 font-medium py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center gap-2 border border-gray-700">
                    <i class="fas fa-user-plus"></i>
                    Fazer Cadastro
                </button>
            </div>
            <div class="mt-2 flex justify-end">
                <a href="#" class="text-red-600 hover:underline text-sm">Esqueci minha senha</a>
            </div>
        </form>
    </div>
    <script>
        // Alternar visibilidade da senha
        function togglePassword(inputId, icon) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Validação simples do formulário (pode ser expandida)
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            const senha = document.getElementById('senha').value;
            if (senha.length < 8) {
                alert('A senha deve conter pelo menos 8 caracteres.');
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
