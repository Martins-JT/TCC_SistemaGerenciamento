<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Fornecedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .checkbox-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-item input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #4b5563;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .checkbox-item input[type="checkbox"]:checked {
            background-color: #3b82f6;
            border-color: #3b82f6;
        }
        .checkbox-item input[type="checkbox"]:checked::after {
            content: '\2713';
            position: absolute;
            color: white;
            font-size: 14px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl overflow-hidden">
        <div class="bg-blue-600 py-4 px-6">
            <h1 class="text-2xl font-bold text-white">Cadastro de Fornecedor</h1>
            <p class="text-blue-100">Preencha os dados abaixo para se cadastrar</p>
        </div>
        <form id="supplierForm" action="arquivos_php/cadastro.php" method="POST" enctype="multipart/form-data" class="p-6 space-y-8">
            <!-- 1. Informação de Login -->
            <div>
                <h2 class="text-lg font-semibold text-blue-700 mb-4 flex items-center gap-2"><i class="fas fa-user-lock"></i> Informação de Login</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail *</label>
                        <div class="relative">
                            <input type="email" id="email" name="email" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="seu@email.com">
                            <i class="fas fa-envelope absolute right-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    <!-- Senha -->
                    <div>
                        <label for="senha" class="block text-sm font-medium text-gray-700 mb-1">Senha *</label>
                        <div class="relative">
                            <input type="password" id="senha" name="senha" required minlength="8"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition pr-10"
                                placeholder="Digite sua senha">
                            <i class="fas fa-eye password-toggle" onclick="togglePassword('senha', this)"></i>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">Mínimo de 8 caracteres</p>
                    </div>
                    <!-- Confirmar Senha -->
                    <div>
                        <label for="confirmarSenha" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Senha *</label>
                        <div class="relative">
                            <input type="password" id="confirmarSenha" name="confirmarSenha" required minlength="8"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition pr-10"
                                placeholder="Confirme sua senha">
                            <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmarSenha', this)"></i>
                        </div>
                        <p id="senhaErro" class="text-xs text-red-500 mt-1 hidden">As senhas não coincidem.</p>
                    </div>
                </div>
            </div>
            <!-- 2. Dados da Empresa -->
            <div>
                <h2 class="text-lg font-semibold text-blue-700 mb-4 flex items-center gap-2"><i class="fas fa-building"></i> Dados da Empresa</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Nome da Empresa -->
                    <div>
                        <label for="empresa" class="block text-sm font-medium text-gray-700 mb-1">Nome da Empresa *</label>
                        <div class="relative">
                            <input type="text" id="empresa" name="empresa" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="Digite o nome da empresa">
                            <i class="fas fa-building absolute right-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                    <!-- CNPJ -->
                    <div>
                        <label for="cnpj" class="block text-sm font-medium text-gray-700 mb-1">CNPJ *</label>
                        <div class="relative">
                            <input type="text" id="cnpj" name="cnpj" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="00.000.000/0000-00"
                                oninput="formatCNPJ(this)">
                            <i class="fas fa-id-card absolute right-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                </div>
                <!-- Áreas de Interesse -->
                <div class="mt-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Áreas de Interesse (Construção Civil) *</label>
                    <div class="checkbox-container">
                        <div class="checkbox-item">
                            <input type="checkbox" id="alvenaria" name="interestAreas[]" value="alvenaria">
                            <label for="Alvenaria">Alvenaria</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="hidraulica" name="interestAreas[]" value="hidraulica">
                            <label for="Hidraulica">Hidráulica</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="eletrica" name="interestAreas[]" value="eletrica">
                            <label for="Eletrica">Elétrica</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="acabamento" name="interestAreas[]" value="acabamento">
                            <label for="Acabamento">Acabamento</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="fundacoes" name="interestAreas[]" value="fundacoes">
                            <label for="Fundacoes">Fundações</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="estruturas" name="interestAreas[]" value="estruturas">
                            <label for="Estruturas">Estruturas Metálicas</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="pintura" name="interestAreas[]" value="pintura">
                            <label for="Pintura">Pintura</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="drywall" name="interestAreas[]" value="drywall">
                            <label for="Drywall">Drywall</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="impermeabilizacao" name="interestAreas[]" value="impermeabilizacao">
                            <label for="Impermeabilizacao">Impermeabilização</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="carpintaria" name="interestAreas[]" value="carpintaria">
                            <label for="Carpintaria">Carpintaria</label>
                        </div>
                    </div>
                    <p id="interestError" class="text-red-500 text-sm mt-1 hidden">Selecione pelo menos uma área de interesse</p>
                </div>
            </div>
            <!-- 3. Contato -->
            <div>
                <h2 class="text-lg font-semibold text-blue-700 mb-4 flex items-center gap-2"><i class="fas fa-address-book"></i> Contato</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="rua" class="block text-sm font-medium text-gray-700 mb-1">Rua *</label>
                        <input type="text" id="rua" name="rua" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            placeholder="Digite a rua">
                    </div>
                    <div>
                        <label for="numero" class="block text-sm font-medium text-gray-700 mb-1">Número *</label>
                        <input type="text" id="numero" name="numero" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            placeholder="Número">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
                    <div>
                        <label for="cidade" class="block text-sm font-medium text-gray-700 mb-1">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            placeholder="Digite sua cidade">
                    </div>
                    <div>
                        <label for="estado" class="block text-sm font-medium text-gray-700 mb-1">Estado *</label>
                        <select id="estado" name="estado" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition appearance-none">
                            <option value="">Selecione um estado</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-3 top-3 text-gray-400 pointer-events-none"></i>
                    </div>
                    <div>
                        <label for="cep" class="block text-sm font-medium text-gray-700 mb-1">CEP *</label>
                        <input type="text" id="cep" name="cep" required maxlength="9"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                            placeholder="00000-000"
                            oninput="formatCEP(this)">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                    <div>
                        <label for="telefone" class="block text-sm font-medium text-gray-700 mb-1">Telefone *</label>
                        <div class="relative">
                            <input type="tel" id="telefone" name="telefone" required pattern=".{8,}" maxlength="20"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                                placeholder="(99) 99999-9999">
                            <i class="fas fa-phone absolute right-3 top-3 text-gray-400"></i>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pt-4 flex gap-3 flex-col md:flex-row">
                <button type="submit" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-user-plus"></i>
                    Cadastrar
                </button>
                <button type="button" onclick="document.getElementById('supplierForm').reset(); clearErrors();" class="w-full md:w-auto bg-gray-300 hover:bg-gray-400 text-gray-800 font-medium py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-eraser"></i>
                    Limpar Formulário
                </button>
                <button type="button"
                    onclick="window.location.href='login.html';"
                    class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i>
                    Já tenho cadastro / Login
                </button>
            </div>
        </form>
    </div>
    <script>
        // Formatar CNPJ
        function formatCNPJ(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 12) {
                value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2}).*/, '$1.$2.$3/$4-$5');
            } else if (value.length > 8) {
                value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4}).*/, '$1.$2.$3/$4');
            } else if (value.length > 5) {
                value = value.replace(/^(\d{2})(\d{3})(\d{3}).*/, '$1.$2.$3');
            } else if (value.length > 2) {
                value = value.replace(/^(\d{2})(\d{3}).*/, '$1.$2');
            }
            input.value = value;
        }

        // Formatar CEP
        function formatCEP(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 5) {
                value = value.replace(/^(\d{5})(\d{0,3}).*/, '$1-$2');
            }
            input.value = value;
        }

        // Alternar visibilidade da senha
        function togglePassword(inputId, icon) {
            const passwordInput = document.getElementById(inputId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // Limpar mensagens de erro ao limpar formulário
        function clearErrors() {
            document.getElementById('interestError').classList.add('hidden');
            document.getElementById('senhaErro').classList.add('hidden');
        }

        // Validação do formulário
        document.getElementById('supplierForm').addEventListener('submit', function(event) {
            // Validar áreas de interesse
            const checkboxes = document.querySelectorAll('input[name="interestAreas[]"]:checked');
            const interestError = document.getElementById('interestError');
            let hasError = false;

            if (checkboxes.length === 0) {
                interestError.classList.remove('hidden');
                hasError = true;
            } else {
                interestError.classList.add('hidden');
            }

            // Validar confirmação de senha
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            const senhaErro = document.getElementById('senhaErro');
            if (senha !== confirmarSenha) {
                senhaErro.classList.remove('hidden');
                hasError = true;
            } else {
                senhaErro.classList.add('hidden');
            }

            if (hasError) {
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
